<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🥠 HERE IS FORTUNE COOKIE FOR YOU!</title>

  <!-- Open Graph (KakaoTalk / SNS 링크 프리뷰) -->
  <meta property="og:type"         content="website" />
  <meta property="og:title"        content="🥠 HERE IS FORTUNE COOKIE FOR YOU!" />
  <meta property="og:description"  content="CRACK IT AND FORTUNE IT ! 오늘의 운세를 부숴보세요." />
  <meta property="og:image"        content="https://khs412khs-wq.github.io/fortune-cookie/app%20icon.jpg" />
  <meta property="og:image:width"  content="1024" />
  <meta property="og:image:height" content="1024" />
  <meta property="og:url"          content="https://khs412khs-wq.github.io/fortune-cookie/docs/share-redirect.html" />
  <meta name="twitter:card"        content="summary_large_image" />
  <script>
    const params = new URLSearchParams(window.location.search);
    const scheme = params.get("scheme") || "fortunecookie";
    const path = params.get("path") || "open";
    const storeID = params.get("store");
    const DEEP_LINK = `${scheme}://${path}`;
    const APP_STORE_URL = storeID
      ? `https://apps.apple.com/app/fortunecookie/id${storeID}`
      : "https://apps.apple.com/search?term=fortune%20cookie";

    function openAppOrStore() {
      const started = Date.now();
      window.location.href = DEEP_LINK;

      setTimeout(function () {
        if (Date.now() - started < 1600) {
          window.location.href = APP_STORE_URL;
        }
      }, 1200);
    }

    window.addEventListener("load", openAppOrStore);
  </script>
</head>
<body>
  <p>포츈쿠키 앱으로 이동 중이에요...</p>
  <p><a href="#" onclick="openAppOrStore(); return false;">앱이 열리지 않으면 App Store에서 받기</a></p>
</body>
</html>
